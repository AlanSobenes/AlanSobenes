name: Refresh profile stats

# Regenerates assets/stats-*.svg from live GitHub data and commits the result.
# Self-hosting these means the profile never depends on a third-party render
# service that can rate-limit, 503, or shut down.

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/gen-stats.js'
      - '.github/workflows/refresh-stats.yml'

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: node scripts/gen-stats.js

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- assets; then
            echo 'No stat changes.'
            exit 0
          fi
          git add assets
          git commit -m 'chore: refresh profile stats [skip ci]'
          git push
